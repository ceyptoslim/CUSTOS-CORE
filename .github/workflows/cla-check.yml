name: CLA Check

on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, edited]

jobs:
  cla-check:
    name: CLA Verification
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout PR branch (includes CLA_SIGNERS.md at HEAD)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify CLA signature
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            const prAuthor = context.payload.pull_request.user.login;
            const prAuthorLower = prAuthor.toLowerCase();
            const prNumber = context.payload.pull_request.number;
            const claVersion = 'v1.0';
            
            core.info(`Checking CLA for @${prAuthor} on PR #${prNumber}`);
            
            // Read CLA_SIGNERS.md from the PR's HEAD
            let signersContent = '';
            try {
              signersContent = fs.readFileSync('CLA_SIGNERS.md', 'utf8');
            } catch (e) {
              core.setFailed('CLA_SIGNERS.md not found. This file must exist in the repository.');
              return;
            }
            
            // Check if the PR author's username appears in the signers file
            // We look for @username or username (case-insensitive)
            const lines = signersContent.split('\n');
            let found = false;
            let signerType = '';
            let signedDate = '';
            
            for (const line of lines) {
              // Skip header rows, separator rows, comments, and empty lines
              if (line.startsWith('|--') || line.startsWith('<!--') || 
                  line.trim() === '' || line.startsWith('#') ||
                  line.includes('GitHub Username') || line.includes('---')) {
                continue;
              }
              
              // Check if this line contains the PR author's username
              // Match patterns like: | @username | or | username |
              const cellMatch = line.match(/\|[@\s]*([a-zA-Z0-9_-]+)\s*\|(.+)\|(.+)\|(.+)\|/);
              if (cellMatch) {
                const username = cellMatch[1].toLowerCase();
                if (username === prAuthorLower) {
                  found = true;
                  signerType = cellMatch[2].trim();
                  signedDate = cellMatch[3].trim();
                  break;
                }
              }
            }
            
            if (found) {
              core.info(`✅ CLA signed by @${prAuthor} (${signerType}, ${signedDate})`);
              
              // Post or update a success comment
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
              });
              
              const existingComment = comments.find(c => 
                c.user.type === 'Bot' && c.body.includes('CLA Verification')
              );
              
              const successMessage = [
                '## ✅ CLA Verification Passed',
                '',
                `@${prAuthor} has signed the Contributor License Agreement (CLA v1.0).`,
                '',
                'Thank you for your contribution to CUSTOS!',
                '',
                '---',
                '_This check is automated. The CLA record is in [CLA_SIGNERS.md](../blob/main/CLA_SIGNERS.md)._'
              ].join('\n');
              
              if (existingComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existingComment.id,
                  body: successMessage,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: successMessage,
                });
              }
            } else {
              core.setFailed(`❌ CLA not signed by @${prAuthor}`);
              
              const failMessage = [
                '## ❌ CLA Verification Required',
                '',
                `@${prAuthor} has not signed the Contributor License Agreement (CLA).`,
                '',
                'Before this PR can be merged, you must sign the CLA:',
                '',
                '1. Read the [CLA document](../blob/main/CLA.md)',
                '2. Add your GitHub username to the appropriate table in [CLA_SIGNERS.md](../blob/main/CLA_SIGNERS.md)',
                '3. Commit this change as part of your PR',
                '',
                '**Format:**',
                '```markdown',
                '| @your-github-username | Individual | YYYY-MM-DD | v1.0 |',
                '```',
                '',
                'For corporate contributions, see the [CCLA section](../blob/main/CLA.md#corporate-contributor-license-agreement-ccla).',
                '',
                '---',
                '_This check is automated. Questions? Contact frolifeproductions@gmail.com_'
              ].join('\n');
              
              // Check for existing comment to avoid duplicates
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
              });
              
              const existingComment = comments.find(c => 
                c.user.type === 'Bot' && c.body.includes('CLA Verification')
              );
              
              if (existingComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existingComment.id,
                  body: failMessage,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: failMessage,
                });
              }
            }

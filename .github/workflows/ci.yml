name: CUSTOS CI

on:
  push:
    branches: [main, "ceyptoslim-patch-1"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest-cov coverage

      - name: Lint with ruff
        run: |
          pip install ruff==0.4.4
          ruff check custos/ main.py

      - name: Security scan with bandit
        run: |
          pip install bandit==1.7.9
          bandit -r custos/ main.py -ll -ii

      - name: Dependency audit with pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --strict

      - name: Run tests with coverage
        env:
          AUTH_DISABLED: "1"
        run: |
          pytest tests/ -v --tb=short \
            --cov=custos --cov=main \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html

      - name: Upload coverage XML artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

      - name: Verify minimum coverage threshold
        if: matrix.python-version == '3.12'
        env:
          AUTH_DISABLED: "1"
        run: |
          pytest tests/ --cov=custos --cov=main --cov-report=term-missing --cov-fail-under=80

  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t custos-core:ci .

      - name: Smoke test container
        run: |
          docker run -d --name custos-smoke -p 8000:8000 \
            -e AUTH_DISABLED=1 \
            custos-core:ci
          trap "docker stop custos-smoke || true" EXIT
          for i in $(seq 1 10); do
            curl -sf http://localhost:8000/health && break
            echo "Waiting for service... attempt $i"
            sleep 3
          done
          curl -f http://localhost:8000/health

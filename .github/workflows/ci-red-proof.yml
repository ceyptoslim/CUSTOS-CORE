name: CI Red-Proof

# Purposeful-green check: CI must be ABLE to fail.
#
# A green suite that cannot fail proves nothing. This workflow applies
# known-bad sabotage patches (scripts/ci-sabotage/) that MUST turn the
# suite red. The job FAILS if the suite stays green on known-bad code —
# that would mean our tests cannot detect the exact regression class
# they were written for (faulty-green detection).
#
# Record spec v3 (external review FN-CUSTOS-REDPROOF-001, Oct 2026):
#  - full failure set: pytest runs WITHOUT -x so the JUnit records
#    every failing assertion in the class, not just the first
#  - sealed injection diff: the post-sabotage diff is captured, hashed
#    into the record identity, and uploaded (contemporaneous, not
#    merely replayable)
#  - independent exit-code artifact: the shell writes the exit code to
#    its own artifact file BEFORE the record is generated, so the
#    integer is observable through a channel independent of the record
#    that asserts it

on:
  schedule:
    - cron: "0 6 * * 1"  # weekly, Monday 06:00 UTC
  workflow_dispatch:

jobs:
  red-proof:
    name: Sabotage ${{ matrix.sabotage }} must turn tests RED
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sabotage: ["001-weaken-admin-auth", "002-invert-opa-deny", "003-weaken-action-gate", "004-weaken-custody-verify", "005-weaken-citation", "006-weaken-trace-binding", "007-weaken-fail-closed-proxy"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Verify pinned pre-registered design (003)
        if: matrix.sabotage == '003-weaken-action-gate'
        run: |
          echo "94ed3ed624769d34978a94a8b5114cf2caab93ca8d6ab3b74ef90d1d6ef2f7e4  docs/red-proof-records/sabotage-003/DESIGN.md" | sha256sum -c -
          echo "pre-registered design verified: frozen criteria match the pinned hash"

      - name: Verify pinned pre-registered design (004)
        if: matrix.sabotage == '004-weaken-custody-verify'
        run: |
          echo "1fa2b6a6f757411c0adaa669489309c74549f6c6b14bf916492cf07bacb3ca44  docs/red-proof-records/sabotage-custody/DESIGN.md" | sha256sum -c -
      - name: Verify pinned pre-registered design (004)
        if: matrix.sabotage == '004-weaken-custody-verify'
        run: |
          echo "1fa2b6a6f757411c0adaa669489309c74549f6c6b14bf916492cf07bacb3ca44  docs/red-proof-records/sabotage-custody/DESIGN.md" | sha256sum -c -
      - name: Verify pinned pre-registered design (005)
        if: matrix.sabotage == '005-weaken-citation'
        run: |
          echo "8709bf77d98f87b90f4cebd1f8c5dba98b8f7d81617b192f3f4fb4ab6851ac5e  docs/red-proof-records/sabotage-citation/DESIGN.md" | sha256sum -c -
          echo "pre-registered design verified: frozen criteria match the pinned hash"

      - name: Verify pinned pre-registered design (007)
        if: matrix.sabotage == '007-weaken-fail-closed-proxy'
        run: |
          echo "7e517dcff88dad94dc5375d652dc4605006d8fad386454a151d214c4347caf42  docs/red-proof-records/sabotage-mcp-proxy/DESIGN.md" | sha256sum -c -
          echo "pre-registered design verified: frozen criteria match the pinned hash"

      - name: Verify pinned pre-registered design (006)
        if: matrix.sabotage == '006-weaken-trace-binding'
        run: |
          echo "7d9a934741c70554cbe2189441ac9a2a6dedf579964977c52b46aad97fbb06dc  docs/red-proof-records/sabotage-trace-binding/DESIGN.md" | sha256sum -c -
          echo "pre-registered design verified: frozen criteria match the pinned hash"

      - name: Control probe on clean build (003)
        if: matrix.sabotage == '003-weaken-action-gate'
        run: |
          PROBE_PHASE=clean GITHUB_RUN_ID=${{ github.run_id }} \
            python3 scripts/red-proof/action_gate_probe.py > red-proof-probe-clean.json
          cat red-proof-probe-clean.json

      - name: Apply known-bad sabotage patch
        run: bash scripts/ci-sabotage/${{ matrix.sabotage }}.sh

      - name: Seal post-injection diff (v3)
        run: |
          git diff > red-proof-injection-diff.patch
          if [ ! -s red-proof-injection-diff.patch ]; then
            echo "::error::Empty injection diff — sabotage produced no tracked-file changes."
            exit 1
          fi
          DIFF_SHA=$(sha256sum red-proof-injection-diff.patch | cut -d' ' -f1)
          echo "diff_sha=$DIFF_SHA" >> "$GITHUB_OUTPUT"
          echo "diff_lines=$(wc -l < red-proof-injection-diff.patch)" >> "$GITHUB_OUTPUT"
          echo "injection diff sealed: $DIFF_SHA ($(wc -l < red-proof-injection-diff.patch) lines)"
        id: diff

      - name: Control probe after injection (003)
        if: matrix.sabotage == '003-weaken-action-gate'
        run: |
          PROBE_PHASE=injected GITHUB_RUN_ID=${{ github.run_id }} \
            INJECTION_DIFF_SHA256=${{ steps.diff.outputs.diff_sha }} \
            python3 scripts/red-proof/action_gate_probe.py > red-proof-probe-injected.json
          cat red-proof-probe-injected.json

      - name: "Run tests (expected: RED, full failure set)"
        id: run
        run: |
          TESTS_STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "tests_started=$TESTS_STARTED" >> "$GITHUB_OUTPUT"
          set +e
          pytest tests/ -q --no-header --tb=short \
            --junitxml=red-proof-junit.xml > red-proof-pytest-output.txt 2>&1
          code=$?
          # v3: the shell — not the record — observes its own exit code,
          # in a channel independent of the evidence record below.
          echo "$code" > red-proof-exit-code.txt
          TESTS_COMPLETED=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "tests_completed=$TESTS_COMPLETED" >> "$GITHUB_OUTPUT"
          tail -5 red-proof-pytest-output.txt

      - name: Enforce red-proof verdict
        run: |
          if [ "${{ steps.run.outputs.exit_code }}" -eq 0 ]; then
            echo "::error::FAULTY GREEN — the suite PASSED on known-bad code (${{ matrix.sabotage }}). Tests cannot detect this regression class."
            exit 1
          fi

      - name: Write structured red-proof evidence record (v3)
        if: always()
        run: |
          SAB_SHA=$(sha256sum "scripts/ci-sabotage/${{ matrix.sabotage }}.sh" | cut -d' ' -f1)
          COMMIT_SHA=$(git rev-parse HEAD)
          JUNIT_SHA=$(sha256sum red-proof-junit.xml | cut -d' ' -f1)
          OUTPUT_SHA=$(sha256sum red-proof-pytest-output.txt | cut -d' ' -f1)
          JUNIT_FAILURES=$(grep -c "<failure" red-proof-junit.xml || echo 0)
          EXIT_CODE="${{ steps.run.outputs.exit_code }}"
          if [ -z "$EXIT_CODE" ]; then EXIT_CODE=0; fi
          if [ -f red-proof-exit-code.txt ]; then
            EXITCODE_SHA=$(sha256sum red-proof-exit-code.txt | cut -d' ' -f1)
          else
            EXITCODE_SHA="MISSING"
          fi
          if [ -f red-proof-injection-diff.patch ]; then
            DIFF_SHA=$(sha256sum red-proof-injection-diff.patch | cut -d' ' -f1)
          else
            DIFF_SHA="MISSING"
          fi
          if [ "$EXIT_CODE" -ne 0 ]; then VERDICT="RED-CONFIRMED"; ACTUAL="RED"; else VERDICT="FAULTY-GREEN"; ACTUAL="GREEN"; fi
          cat > red-proof-evidence.json <<EOF
          {
            "record_version": 3,
            "identity": {
              "run_id": "${{ github.run_id }}",
              "run_number": "${{ github.run_number }}",
              "run_attempt": "${{ github.run_attempt }}",
              "commit_sha": "$COMMIT_SHA",
              "injected_regression_id": "${{ matrix.sabotage }}",
              "sabotage_script_sha256": "$SAB_SHA",
              "injection_diff_sha256": "$DIFF_SHA"
            },
            "time": {
              "tests_started_utc": "${{ steps.run.outputs.tests_started }}",
              "tests_completed_utc": "${{ steps.run.outputs.tests_completed }}",
              "record_generated_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            },
            "observations": {
              "pytest_exit_code": $EXIT_CODE,
              "exit_code_artifact": {"file": "red-proof-exit-code.txt", "sha256": "$EXITCODE_SHA"},
              "injection_diff": {"file": "red-proof-injection-diff.patch", "sha256": "$DIFF_SHA"},
              "junit_xml": {"file": "red-proof-junit.xml", "sha256": "$JUNIT_SHA"},
              "junit_failures": $JUNIT_FAILURES,
              "pytest_output": {"file": "red-proof-pytest-output.txt", "sha256": "$OUTPUT_SHA"},
              "ci_job_outcome": "${{ steps.run.outcome }}"
            },
            "verdict": {
              "expected": "RED",
              "actual": "$ACTUAL",
              "verdict": "$VERDICT",
              "rule": {
                "id": "red-proof-verdict-rule",
                "version": 3,
                "mapping": "observations.pytest_exit_code != 0 -> RED-CONFIRMED; else FAULTY-GREEN"
              }
            },
            "provenance": {
              "workflow": "ci-red-proof",
              "repo": "ceyptoslim/CUSTOS-CORE",
              "runner": "github-actions",
              "artifact": "red-proof-records-${{ matrix.sabotage }}"
            }
          }
          EOF
          echo "--- red-proof evidence record (v3) ---"
          cat red-proof-evidence.json

      - name: Attach control-probe observations (003)
        if: always() && matrix.sabotage == '003-weaken-action-gate'
        run: |
          python3 - <<'PY'
          import hashlib, json
          rec = json.load(open("red-proof-evidence.json"))
          obs = rec["observations"]
          for phase, fname in [
              ("control_probe_clean", "red-proof-probe-clean.json"),
              ("control_probe_injected", "red-proof-probe-injected.json"),
          ]:
              try:
                  data = open(fname, "rb").read()
                  obs[phase] = {"file": fname, "sha256": hashlib.sha256(data).hexdigest()}
              except FileNotFoundError:
                  obs[phase] = {"file": fname, "sha256": "MISSING"}
          json.dump(rec, open("red-proof-evidence.json", "w"), indent=2)
          PY
          echo "--- 003 record with probe observations ---"
          cat red-proof-evidence.json

      - name: Red confirmed — suite can fail as designed
        if: ${{ steps.run.outputs.exit_code != 0 }}
        run: |
          echo "Suite went RED under sabotage ${{ matrix.sabotage }} (exit ${{ steps.run.outputs.exit_code }}, ${{ steps.diff.outputs.diff_lines }}-line injection diff sealed). CI green is meaningful. Evidence: red-proof-evidence.json, red-proof-junit.xml, red-proof-injection-diff.patch, red-proof-exit-code.txt."

      - name: Upload red-proof evidence records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: red-proof-records-${{ matrix.sabotage }}
          path: |
            red-proof-evidence.json
            red-proof-junit.xml
            red-proof-pytest-output.txt
            red-proof-injection-diff.patch
            red-proof-exit-code.txt
          if-no-files-found: error

      - name: Upload control-probe artifacts (003)
        if: always() && matrix.sabotage == '003-weaken-action-gate'
        uses: actions/upload-artifact@v4
        with:
          name: red-proof-probe-${{ matrix.sabotage }}
          path: |
            red-proof-probe-clean.json
            red-proof-probe-injected.json
          if-no-files-found: warn

  custody-attacks:
    name: Custody attack — ${{ matrix.attack }} must be DETECTED
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        attack: ["001-rewrite-backend", "002-truncate-tail", "003-suppress-anchor"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Verify pinned pre-registered design (custody)
        run: |
          echo "1fa2b6a6f757411c0adaa669489309c74549f6c6b14bf916492cf07bacb3ca44  docs/red-proof-records/sabotage-custody/DESIGN.md" | sha256sum -c -
          echo "pre-registered design verified: frozen criteria match the pinned hash"

      - name: "Execute custody attack (expected: DETECTED)"
        run: |
          GITHUB_RUN_ID=${{ github.run_id }} \
            python3 scripts/red-proof/custody_attack.py ${{ matrix.attack }} > custody-attack-observation.json
          cat custody-attack-observation.json

      - name: Upload custody attack evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custody-attack-records-${{ matrix.attack }}
          path: custody-attack-observation.json
          if-no-files-found: error

name: CI Red-Proof

# Purposeful-green check: CI must be ABLE to fail.
#
# A green suite that cannot fail proves nothing. This workflow applies
# known-bad sabotage patches (scripts/ci-sabotage/) that MUST turn the
# suite red. The job FAILS if the suite stays green on known-bad code —
# that would mean our tests cannot detect the exact regression class
# they were written for (faulty-green detection).

on:
  schedule:
    - cron: "0 6 * * 1"  # weekly, Monday 06:00 UTC
  workflow_dispatch:

jobs:
  red-proof:
    name: Sabotage ${{ matrix.sabotage }} must turn tests RED
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sabotage: ["001-weaken-admin-auth", "002-invert-opa-deny"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Apply known-bad sabotage patch
        run: bash scripts/ci-sabotage/${{ matrix.sabotage }}.sh

      - name: "Run tests (expected: RED)"
        id: run
        run: |
          set +e
          pytest tests/ -q --no-header -x --tb=short \
            --junitxml=red-proof-junit.xml > red-proof-pytest-output.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          tail -5 red-proof-pytest-output.txt

      - name: Enforce red-proof verdict
        run: |
          if [ "${{ steps.run.outputs.exit_code }}" -eq 0 ]; then
            echo "::error::FAULTY GREEN — the suite PASSED on known-bad code (${{ matrix.sabotage }}). Tests cannot detect this regression class."
            exit 1
          fi

      - name: Write structured red-proof evidence record
        if: always()
        run: |
          SAB_SHA=$(sha256sum "scripts/ci-sabotage/${{ matrix.sabotage }}.sh" | cut -d' ' -f1)
          COMMIT_SHA=$(git rev-parse HEAD)
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EXIT_CODE="${{ steps.run.outputs.exit_code }}"
          if [ -z "$EXIT_CODE" ]; then EXIT_CODE=0; fi
          if [ "$EXIT_CODE" -ne 0 ]; then VERDICT="RED-CONFIRMED"; OUTCOME="RED"; else VERDICT="FAULTY-GREEN"; OUTCOME="GREEN"; fi
          cat > red-proof-evidence.json <<EOF
          {
            "workflow": "ci-red-proof",
            "repo": "ceyptoslim/CUSTOS-CORE",
            "sabotage": "${{ matrix.sabotage }}",
            "sabotage_script_sha256": "$SAB_SHA",
            "commit_sha": "$COMMIT_SHA",
            "pytest_exit_code": $EXIT_CODE,
            "expected_outcome": "RED",
            "actual_outcome": "$OUTCOME",
            "verdict": "$VERDICT",
            "recorded_at_utc": "$TIMESTAMP",
            "runner": "github-actions"
          }
          EOF
          echo "--- red-proof evidence record ---"
          cat red-proof-evidence.json

      - name: Red confirmed — suite can fail as designed
        if: ${{ steps.run.outputs.exit_code != 0 }}
        run: |
          echo "Suite went RED under sabotage ${{ matrix.sabotage }} (exit ${{ steps.run.outputs.exit_code }}). CI green is meaningful. Evidence: red-proof-evidence.json, red-proof-junit.xml."

      - name: Upload red-proof evidence records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: red-proof-records-${{ matrix.sabotage }}
          path: |
            red-proof-evidence.json
            red-proof-junit.xml
            red-proof-pytest-output.txt
          if-no-files-found: error

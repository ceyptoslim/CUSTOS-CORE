name: CI Red-Proof

# Purposeful-green check: CI must be ABLE to fail.
#
# A green suite that cannot fail proves nothing. This workflow applies
# known-bad sabotage patches (scripts/ci-sabotage/) that MUST turn the
# suite red. The job FAILS if the suite stays green on known-bad code —
# that would mean our tests cannot detect the exact regression class
# they were written for (faulty-green detection).

on:
  schedule:
    - cron: "0 6 * * 1"  # weekly, Monday 06:00 UTC
  workflow_dispatch:

jobs:
  red-proof:
    name: Sabotage ${{ matrix.sabotage }} must turn tests RED
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sabotage: ["001-weaken-admin-auth", "002-invert-opa-deny"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Apply known-bad sabotage patch
        run: bash scripts/ci-sabotage/${{ matrix.sabotage }}.sh
      - name: "Run tests (expected: RED)"
        id: run
        run: |
          TESTS_STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "tests_started=$TESTS_STARTED" >> "$GITHUB_OUTPUT"
          set +e
          pytest tests/ -q --no-header -x --tb=short \
            --junitxml=red-proof-junit.xml > red-proof-pytest-output.txt 2>&1
          code=$?
          TESTS_COMPLETED=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "tests_completed=$TESTS_COMPLETED" >> "$GITHUB_OUTPUT"
          tail -5 red-proof-pytest-output.txt

      - name: Enforce red-proof verdict
        run: |
          if [ "${{ steps.run.outputs.exit_code }}" -eq 0 ]; then
            echo "::error::FAULTY GREEN — the suite PASSED on known-bad code (${{ matrix.sabotage }}). Tests cannot detect this regression class."
            exit 1
          fi

      - name: Write structured red-proof evidence record (v2)
        if: always()
        run: |
          SAB_SHA=$(sha256sum "scripts/ci-sabotage/${{ matrix.sabotage }}.sh" | cut -d' ' -f1)
          COMMIT_SHA=$(git rev-parse HEAD)
          JUNIT_SHA=$(sha256sum red-proof-junit.xml | cut -d' ' -f1)
          OUTPUT_SHA=$(sha256sum red-proof-pytest-output.txt | cut -d' ' -f1)
          EXIT_CODE="${{ steps.run.outputs.exit_code }}"
          if [ -z "$EXIT_CODE" ]; then EXIT_CODE=0; fi
          if [ "$EXIT_CODE" -ne 0 ]; then VERDICT="RED-CONFIRMED"; ACTUAL="RED"; else VERDICT="FAULTY-GREEN"; ACTUAL="GREEN"; fi
          cat > red-proof-evidence.json <<EOF
          {
            "record_version": 2,
            "identity": {
              "run_id": "${{ github.run_id }}",
              "run_number": "${{ github.run_number }}",
              "run_attempt": "${{ github.run_attempt }}",
              "commit_sha": "$COMMIT_SHA",
              "injected_regression_id": "${{ matrix.sabotage }}",
              "sabotage_script_sha256": "$SAB_SHA"
            },
            "time": {
              "tests_started_utc": "${{ steps.run.outputs.tests_started }}",
              "tests_completed_utc": "${{ steps.run.outputs.tests_completed }}",
              "record_generated_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            },
            "observations": {
              "pytest_exit_code": $EXIT_CODE,
              "junit_xml": {"file": "red-proof-junit.xml", "sha256": "$JUNIT_SHA"},
              "pytest_output": {"file": "red-proof-pytest-output.txt", "sha256": "$OUTPUT_SHA"},
              "ci_job_outcome": "${{ steps.run.outcome }}"
            },
            "verdict": {
              "expected": "RED",
              "actual": "$ACTUAL",
              "verdict": "$VERDICT",
              "rule": {
                "id": "red-proof-verdict-rule",
                "version": 2,
                "mapping": "observations.pytest_exit_code != 0 -> RED-CONFIRMED; else FAULTY-GREEN"
              }
            },
            "provenance": {
              "workflow": "ci-red-proof",
              "repo": "ceyptoslim/CUSTOS-CORE",
              "runner": "github-actions",
              "artifact": "red-proof-records-${{ matrix.sabotage }}"
            }
          }
          EOF
          echo "--- red-proof evidence record (v2) ---"
          cat red-proof-evidence.json

      - name: Red confirmed — suite can fail as designed
        if: ${{ steps.run.outputs.exit_code != 0 }}
        run: |
          echo "Suite went RED under sabotage ${{ matrix.sabotage }} (exit ${{ steps.run.outputs.exit_code }}). CI green is meaningful. Evidence: red-proof-evidence.json, red-proof-junit.xml."

      - name: Upload red-proof evidence records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: red-proof-records-${{ matrix.sabotage }}
          path: |
            red-proof-evidence.json
            red-proof-junit.xml
            red-proof-pytest-output.txt
          if-no-files-found: error

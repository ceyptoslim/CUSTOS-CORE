name: anchor-write

# Writes a new epoch to custos-anchors when the frozen observation sets change.
#
# Rules this workflow is built around:
#   * It runs only on a push to main, and the job itself re-checks that. It must
#     never run for a pull request, so a change under review cannot anchor
#     itself. No pull_request or pull_request_target trigger exists here.
#   * The token lives in the anchor-write environment, restricted to main, so it
#     is not readable from a pull request workflow even if one were added.
#   * It refuses to write an epoch that would violate containment. If a digest
#     anchored earlier has moved, the writer stops instead of publishing a record
#     that launders the change. The anchor repository's own verify workflow would
#     catch it too, but a refusal here is the cheaper place to fail.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anchor-write
  cancel-in-progress: false

jobs:
  write:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: anchor-write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Fetch the existing chain
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/anchors"
          base="https://raw.githubusercontent.com/ceyptoslim/custos-anchors/main/anchors"
          curl -fsSL "$base/epoch-0.json" -o "$RUNNER_TEMP/anchors/epoch-0.json"
          epoch=1
          while curl -fsSL "$base/epoch-$epoch.json" -o "$RUNNER_TEMP/anchors/epoch-$epoch.json" 2>/dev/null; do
            epoch=$((epoch + 1))
          done
          echo "chain has $epoch record(s)"

      - name: Refuse to anchor a changed digest
        run: |
          set -euo pipefail
          newest="$(ls -1 "$RUNNER_TEMP"/anchors/epoch-*.json | sort -V | tail -1)"
          bash scripts/check_anchors.sh "$newest" docs/red-proof-records \
            --origin external \
            --chain "$RUNNER_TEMP/anchors" \
            --chain-source "https://github.com/ceyptoslim/custos-anchors"

      - name: Build the next epoch if anything moved
        id: build
        run: |
          set -euo pipefail
          newest="$(ls -1 "$RUNNER_TEMP"/anchors/epoch-*.json | sort -V | tail -1)"
          current_aggregate="$(bash scripts/anchor_digest.sh aggregate docs/red-proof-records)"
          anchored_aggregate="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["aggregate"])' "$newest")"
          if [ "$current_aggregate" = "$anchored_aggregate" ]; then
            echo "nothing to anchor: the aggregate already matches the newest record"
            echo "write=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          prev_epoch="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["epoch"])' "$newest")"
          prev_hash="$(bash scripts/anchor_digest.sh anchor-hash "$newest")"
          next_epoch=$((prev_epoch + 1))
          bash scripts/anchor_digest.sh record docs/red-proof-records "$GITHUB_SHA" "$next_epoch" "$prev_hash" \
            > "$RUNNER_TEMP/epoch-$next_epoch.json"
          echo "writing epoch $next_epoch, previous $prev_hash"
          echo "write=yes" >> "$GITHUB_OUTPUT"
          echo "epoch=$next_epoch" >> "$GITHUB_OUTPUT"

      - name: Append the record to custos-anchors
        if: steps.build.outputs.write == 'yes'
        env:
          ANCHOR_WRITE_TOKEN: ${{ secrets.ANCHOR_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          epoch="${{ steps.build.outputs.epoch }}"
          git clone --depth 1 "https://x-access-token:${ANCHOR_WRITE_TOKEN}@github.com/ceyptoslim/custos-anchors.git" "$RUNNER_TEMP/anchor-repo"
          cd "$RUNNER_TEMP/anchor-repo"
          cp "$RUNNER_TEMP/epoch-$epoch.json" "anchors/epoch-$epoch.json"
          git config user.name "custos-anchor-writer"
          git config user.email "actions@users.noreply.github.com"
          git add "anchors/epoch-$epoch.json"
          {
            printf 'anchors: epoch %s from CUSTOS-CORE %s\n\n' "$epoch" "$GITHUB_SHA"
            printf 'Previous epoch %s. Written by the anchoring workflow on a push to main.\n' "$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["prev_anchor_hash"][:12])' "anchors/epoch-$epoch.json")"
            printf 'The digest scheme is scripts/anchor_digest.sh at the named commit.\n'
          } > "$RUNNER_TEMP/commit-msg.txt"
          git commit -F "$RUNNER_TEMP/commit-msg.txt"
          git push origin HEAD:main

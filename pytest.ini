[pytest]
# CI strictness: green must be meaningful.
# --strict-markers: a typo'd marker name fails the run instead of being ignored
# --strict-config: unknown config keys fail instead of being silently dropped
# -ra: report every non-passing test (skips/xfails included) in the summary
addopts = --strict-markers --strict-config -ra
# xfail_strict: an xfail that unexpectedly PASSES is an error, not a bonus
xfail_strict = true
